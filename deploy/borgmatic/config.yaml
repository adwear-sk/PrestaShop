# borgmatic config for the off-site backup, run by backup.sh in the pinned
# b3vis/borgmatic container (the VPS has no borg and deploy has no root).
# backup.sh mounts everything under /source read-only:
#   /source/db.sql.gz   tonight's verified mysqldump
#   /source/volumes/*   the shop's named volumes (img, upload, download, config, mails)
#   /source/host        /opt/adwear (.env, compose file, Caddyfile, custom code)
# Values in ${...} come from /opt/adwear/.env via the container environment.

source_directories:
    - /source

exclude_patterns:
    # Rebuilt or regenerated by every run; not worth the space.
    - /source/host/backups
    - /source/host/logs

repositories:
    - path: ${BORG_REPO}
      label: storagebox

# The repo key lives in the repo, encrypted with the passphrase. Keep the
# passphrase AND a `borg key export` in Bitwarden: either alone cannot restore.
encryption_passphrase: ${BORG_PASSPHRASE}

# Storage Box SSH runs on port 23; the key and known_hosts are mounted by backup.sh.
ssh_command: ssh -p 23 -i /root/.ssh/storagebox -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes

# Product photos are already JPEG/WebP; auto skips compressing what doesn't shrink.
compression: auto,zstd,3

archive_name_format: 'adwear-{now:%Y-%m-%dT%H:%M:%S}'

keep_daily: 7
keep_weekly: 4
keep_monthly: 6

checks:
    - name: repository
      frequency: 1 week
    - name: archives
      frequency: 1 month

# Catches a missing bind mount. A wrong volume name would still mount an empty
# volume, so backup.sh checks the volume names with `docker volume inspect` first.
source_directories_must_exist: true
