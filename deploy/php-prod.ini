; Production PHP settings for PrestaShop (loaded last, overrides defaults).

; --- OPcache. Timestamp validation is ON, deliberately. ---
; The "immutable cache dir" assumption that justifies validate_timestamps=0 in a
; normal Symfony deploy does NOT hold for PrestaShop: the BO rewrites the compiled
; container at runtime. Saving a single translation is enough —
; TranslationController::translationEditAction() -> ApiController::clearCache()
; -> SymfonyCacheClearer::clear(), which deletes var/cache/prod/admin and warms a
; container into a NEW hash dir (ContainerXxx/). SymfonyCacheClearer contains no
; opcache_reset() at all, and the warm-up runs via ExecKernelCacheClearer, i.e.
; `bin/console cache:clear` in a SEPARATE process whose OPcache is unrelated to
; Apache's shared memory. So with validation off the mod_php workers keep executing
; cached bytecode for AdminKernelProdContainer.php that require()s the directory the
; clear just deleted -> the whole BO 500s permanently until `docker compose restart app`.
; Hit 2026-08-20, 2026-10-03 and twice on 2026-10-07 (BO down ~4 days unnoticed).
; With validation on, the worker re-stats the file, sees it changed, and recompiles —
; the failure degrades from "permanent 500" to at worst a sub-second blip mid-rebuild.
; revalidate_freq=0 (stat on every request) rather than a few seconds, because any
; window at all is a window of 500s. Cost is one stat() per included file per request,
; which realpath_cache absorbs; re-measure against the pre-change baseline of
; front ~0.10s / BO login ~0.065s (2026-10-07) if the shop ever gets busy.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1

; MUST stay off. `prestashop/base` ships enable_file_override=1 in php.ini, and
; combined with validate_timestamps=0 it makes is_file()/file_exists() answer
; from OPcache instead of the disk. var/cache is a *mutable* named volume that
; PrestaShop rewrites at runtime (BO "Clear cache", module install, saving a
; translation), so a cache file that was just deleted still reports as existing.
; Symfony's ConfigCache::isFresh() then short-circuits on that is_file() check,
; never regenerates the file, and the following require() fatals — a permanent
; 500 that only an app restart clears. Seen 2026-08-21 on url_matching_routes.php,
; annotations.php and the sk-SK translation catalogue. With the override off the
; stat hits the disk, the file is regenerated, and Symfony force-invalidates the
; stale bytecode itself (ResourceCheckerConfigCache::write) for files it rewrites in
; process — note that never covered *deleted* files, which is why validate_timestamps
; above had to be turned back on as well.
opcache.enable_file_override=0

realpath_cache_size=4096K
realpath_cache_ttl=600

; --- Hardening / runtime ---
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
memory_limit=512M
max_execution_time=120

; --- Uploads (product images, imports) ---
upload_max_filesize=64M
post_max_size=64M
max_input_vars=10000
