; Production PHP settings for PrestaShop (loaded last, overrides defaults).

; --- OPcache: big perf win, validation off because new code arrives as a new
;     image (container is recreated, cache starts fresh). Bind-mounted custom
;     modules/themes therefore require an `app` container restart to be picked
;     up — the module/theme deploy workflows do exactly that. ---
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

; MUST stay off. `prestashop/base` ships enable_file_override=1 in php.ini, and
; combined with validate_timestamps=0 it makes is_file()/file_exists() answer
; from OPcache instead of the disk. var/cache is a *mutable* named volume that
; PrestaShop rewrites at runtime (BO "Clear cache", module install, saving a
; translation), so a cache file that was just deleted still reports as existing.
; Symfony's ConfigCache::isFresh() then short-circuits on that is_file() check,
; never regenerates the file, and the following require() fatals — a permanent
; 500 that only an app restart clears. Seen 2026-08-21 on url_matching_routes.php,
; annotations.php and the sk-SK translation catalogue. With the override off the
; stat hits the disk, the file is regenerated, and Symfony force-invalidates the
; stale bytecode itself (ResourceCheckerConfigCache::write).
opcache.enable_file_override=0

realpath_cache_size=4096K
realpath_cache_ttl=600

; --- Hardening / runtime ---
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
memory_limit=512M
max_execution_time=120

; --- Uploads (product images, imports) ---
upload_max_filesize=64M
post_max_size=64M
max_input_vars=10000
