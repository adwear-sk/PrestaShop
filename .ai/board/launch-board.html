<title>Adwear Launch Readiness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a sticky header (progress + tabs; tabs move to a fixed bottom bar on phones), one view per tab, and a right-side drawer for an item's detail.
   Colour only marks attention (doing, blocked, waiting on you); the accent blue is for actions, links, the selected tab and the chosen path. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --hover: #f0f2f5;
  --ink: #111827;
  --muted: #5b6472;
  --line: #e3e6eb;
  --accent: #0b69f6;
  --accent-soft: #e7f0fe;
  --on-accent: #ffffff;
  --ask: #7c3aed;     --ask-bg: #efe7fd;
  --todo: #5b6472;    --todo-bg: #eef0f3;
  --doing: #b45309;   --doing-bg: #fef3c7;
  --blocked: #b91c1c; --blocked-bg: #fde2e2;
  --done: #6b7280;    --done-bg: #eceef1;
  --skip: #9ca3af;    --skip-bg: #f4f5f7;
  --shadow: 0 10px 40px rgb(17 24 39 / .18);
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --tabbar-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #161b22; --hover: #1c2128; --ink: #e6edf3; --muted: #8b949e; --line: #30363d;
    --accent: #4c94ff; --accent-soft: #14243d; --on-accent: #0d1117;
    --ask: #c4b5fd; --ask-bg: #2a1f45;
    --todo: #8b949e; --todo-bg: #21262d;
    --doing: #f5b544; --doing-bg: #3a2a0c;
    --blocked: #f87171; --blocked-bg: #3b1414;
    --done: #8b949e; --done-bg: #1c2128;
    --skip: #6e7681; --skip-bg: #1a1f26;
    --shadow: 0 10px 40px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161b22; --hover: #1c2128; --ink: #e6edf3; --muted: #8b949e; --line: #30363d;
  --accent: #4c94ff; --accent-soft: #14243d; --on-accent: #0d1117;
  --ask: #c4b5fd; --ask-bg: #2a1f45;
  --todo: #8b949e; --todo-bg: #21262d;
  --doing: #f5b544; --doing-bg: #3a2a0c;
  --blocked: #f87171; --blocked-bg: #3b1414;
  --done: #8b949e; --done-bg: #1c2128;
  --skip: #6e7681; --skip-bg: #1a1f26;
  --shadow: 0 10px 40px rgb(0 0 0 / .5);
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body.drawer-open { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-body); font-weight: 600; text-wrap: balance; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:is(a, button, select, textarea, input, summary, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header + tabs */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding-block: 12px 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 20px; line-height: 1.2; margin: 2px 0 0; }
.progress { display: flex; align-items: center; gap: 10px; flex: 0 1 320px; min-width: 0; }
.pct { font: 600 18px/1 var(--font-body); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.meter { flex: 1 1 auto; height: 8px; border-radius: 4px; background: var(--todo-bg); display: flex; overflow: hidden; }
.meter span { height: 100%; transition: width .3s; }
.meter .m-done { background: var(--done); }
.meter .m-doing { background: var(--doing); }
.meter .m-blocked { background: var(--blocked); }
.meter .m-skip { background: var(--skip); opacity: .45; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px 9px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { font: 500 11px/1 var(--font-mono); font-variant-numeric: tabular-nums; padding: 3px 6px; border-radius: 999px; background: var(--todo-bg); color: var(--muted); }
.tab[aria-current="page"] .n { background: var(--accent-soft); color: var(--accent); }
.tab .n.attn { background: var(--ask-bg); color: var(--ask); }

main { padding-block: 20px 64px; display: grid; gap: 16px; }
.view-head h2 { font-size: 22px; margin: 0; }
.view-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
#view { display: grid; gap: 18px; min-width: 0; }

/* Shared bits */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-head h2, .panel-head h3 { font-size: 16px; margin: 0; }
.tally { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.notice { padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.notice strong { color: var(--ink); }
.notice.alert { border-color: var(--blocked); }
.empty-filter { color: var(--muted); font-size: 14px; margin: 0; padding: 6px 0; }
.detail { color: var(--muted); font-size: 14px; margin: 0; overflow-wrap: anywhere; }
.note { font-size: 14px; margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--hover); border-left: 3px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.link-btn { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link-btn.danger { color: var(--blocked); }
textarea, .add input, .stop-input, .search { width: 100%; font: inherit; font-size: 14px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
textarea { min-height: 64px; resize: vertical; }
.editor { display: grid; gap: 6px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 13px/1 var(--font-body); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 6px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { font: 600 13px/1 var(--font-mono); width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; flex: none; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.q-select, .sorter { font: inherit; font-size: 12px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.chip, .seg-btn { font: 500 13px/1 var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip b, .seg-btn b { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] b { color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg-btn { border-color: transparent; background: transparent; padding: 5px 10px; }
.seg-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg-btn[aria-pressed="true"] b { color: var(--accent); }
.seg-label { font-size: 12px; color: var(--muted); }

/* Badges + status selects */
.badge { font: 600 11px/1 var(--font-body); letter-spacing: .02em; padding: 4px 7px; border-radius: 4px; white-space: nowrap; display: inline-block; }
.ph-analyzing, .ph-planned { color: var(--todo); background: var(--todo-bg); }
.ph-choose { color: var(--ask); background: var(--ask-bg); }
.ph-working { color: var(--doing); background: var(--doing-bg); }
.ph-done { color: var(--done); background: var(--done-bg); }
.b-blocked { color: var(--blocked); background: var(--blocked-bg); }
.b-ask { color: var(--ask); background: var(--ask-bg); }
.b-rec { color: var(--accent); background: var(--accent-soft); }
.b-chosen { color: var(--on-accent); background: var(--accent); }
.b-origin { color: var(--muted); background: var(--todo-bg); font-weight: 500; }
.b-mine { color: var(--ink); background: var(--todo-bg); font-weight: 500; }
.status, .step-status { font: 600 12px/1 var(--font-body); letter-spacing: .01em; border-radius: 6px; padding: 7px 24px 7px 9px; border: 1px solid transparent; appearance: none; -webkit-appearance: none; cursor: pointer; background-repeat: no-repeat; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-size: 5px 5px, 5px 5px; background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; max-width: 100%; }
.status.sm { padding: 4px 20px 4px 7px; width: 100%; background-position: calc(100% - 11px) 50%, calc(100% - 6px) 50%; }
.status[data-v="todo"], .step-status[data-v="todo"] { color: var(--todo); background-color: var(--todo-bg); }
.status[data-v="doing"], .step-status[data-v="doing"] { color: var(--doing); background-color: var(--doing-bg); }
.status[data-v="blocked"] { color: var(--blocked); background-color: var(--blocked-bg); }
.status[data-v="done"], .step-status[data-v="done"] { color: var(--done); background-color: var(--done-bg); }
.status[data-v="skip"], .step-status[data-v="skip"] { color: var(--skip); background-color: var(--skip-bg); }
.status:disabled, .step-status:disabled { cursor: default; opacity: .9; }

/* Cards + lanes */
ol.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.card[data-status="blocked"] { border-left: 3px solid var(--blocked); }
.card[data-status="doing"] { border-left: 3px solid var(--doing); }
.card-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.card-area { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.card-title { font: 600 14px/1.35 var(--font-body); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.card-title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.card-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; font-size: 12px; color: var(--muted); }
.card-ctrl { display: flex; gap: 4px; align-items: center; min-width: 0; }
.lane { display: grid; gap: 8px; min-width: 0; align-content: start; }
.lane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.lane-head h2, .lane-head h3 { font-size: 15px; margin: 0; }
.lane-hint { color: var(--muted); font-size: 13px; margin: 0; }
.lane[data-over="true"] .lane-head { border-bottom-color: var(--blocked); }
.lane[data-over="true"] .tally, .lane[data-over="true"] .lane-hint { color: var(--blocked); }
.lane[data-attn="true"] .tally { color: var(--ask); }
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; align-items: start; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; align-items: start; }
.board .lane { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.board .card { background: var(--bg); }
.title-list { list-style: none; margin: 0; padding: 0; display: grid; }
.title-list li { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; min-width: 0; }
.title-list li:last-child { border-bottom: 0; }
.title-list a { color: var(--ink); text-decoration: none; min-width: 0; overflow-wrap: anywhere; }
.title-list a:hover { color: var(--accent); text-decoration: underline; }
.title-list small { color: var(--muted); font-size: 12px; white-space: nowrap; flex: none; }
.mark { color: var(--done); font-weight: 600; flex: none; width: 1.1em; }

/* Home */
.home { display: grid; gap: 18px; align-items: start; }
.home .col { display: grid; gap: 18px; min-width: 0; align-content: start; }
@media (min-width: 900px) { .home { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1400px) { .home { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.goal { border-left: 4px solid var(--accent); }
.goal-text { margin: 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.principles summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.principles ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 2px; }
.asks { border-color: var(--ask-bg); }
.asks .panel-head h2 { color: var(--ask); }
.ask-line { display: grid; gap: 2px; padding: 8px 10px; border-radius: 6px; background: var(--ask-bg); color: var(--ink); text-decoration: none; min-width: 0; }
.ask-line:hover .q { text-decoration: underline; }
.ask-line .q { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ask-line small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

/* Inbox + question cards */
.q-group { gap: 10px; }
.q-group .panel-head a { color: var(--ink); text-decoration: none; font-weight: 600; }
.q-group .panel-head a:hover { color: var(--accent); text-decoration: underline; }
.ask { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); min-width: 0; }
.ask[data-blocking="true"] { border-left: 3px solid var(--ask); }
.ask .q { font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.ask .why { color: var(--muted); font-size: 13px; margin: 0; }
.ask-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
details.answered > summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 4px 0; }
.qa { font-size: 14px; display: grid; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.qa:last-child { border-bottom: 0; }
.qa .answer { padding: 6px 10px; border-radius: 6px; background: var(--hover); white-space: pre-wrap; overflow-wrap: anywhere; }
.qa small { color: var(--muted); font-size: 12px; }

/* Checklist */
.cl-tools { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; }
.cl-tools .search { flex: 1 1 220px; min-width: 0; width: auto; }
.groupby-wrap { display: inline-flex; gap: 8px; align-items: center; }
.cl-group { display: grid; gap: 8px; min-width: 0; }
.grp-head { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px; cursor: pointer; }
.grp-head:hover h3 { color: var(--accent); }
.grp-head h3 { font-size: 16px; margin: 0; flex: 1 1 auto; min-width: 0; }
.grp-head .chev { width: 1em; flex: none; color: var(--muted); transition: transform .15s; }
.grp-head[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.grp-head .flag { color: var(--blocked); font-family: var(--font-mono); font-size: 12px; }
.grp-blurb { color: var(--muted); font-size: 13px; margin: 0; max-width: 80ch; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.cl { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
.cl th { text-align: left; font: 500 11px/1.2 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cl td { padding: 4px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; height: 38px; }
.cl tbody tr:last-child td { border-bottom: 0; }
.cl tbody tr:hover td { background: var(--hover); }
.cl .c-status { width: 124px; }
.cl .c-area { width: 180px; }
.cl .c-phase { width: 118px; }
.cl .c-steps { width: 64px; }
.cl .c-blk { width: 92px; }
.cl .c-upd { width: 112px; }
.cl .c-kind { width: 92px; }
.cl .c-tags { width: 220px; }
.cl .c-deps { width: 64px; }
.cl td.c-steps, .cl td.c-upd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row-title { color: var(--ink); text-decoration: none; font-weight: 500; }
.row-title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.cl tr[data-status="done"] .row-title, .cl tr[data-status="skip"] .row-title { color: var(--muted); font-weight: 400; }
.area-cell small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.sec-cell { color: var(--muted); font-size: 13px; }
.dash { color: var(--line); }
.add form { display: grid; gap: 6px; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--surface); }

/* Done list + ship */
.done-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.done-list li { display: flex; gap: 10px; align-items: baseline; padding: 8px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.done-list li:last-child { border-bottom: 0; }
.done-list a { color: var(--ink); text-decoration: none; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.done-list a:hover { color: var(--accent); text-decoration: underline; }
.done-list li[data-status="skip"] a, .done-list li[data-status="skip"] .mark { color: var(--skip); }
.done-list small { color: var(--muted); font-size: 12px; white-space: nowrap; flex: none; }
.repo { font: 600 13px/1 var(--font-mono); margin: 0; }
.commit { font: 12px/1.4 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.ship-card .card-area { text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-size: 12px; }

/* Drawer */
.drawer-backdrop { position: fixed; inset: 0; z-index: 30; background: rgb(13 17 23 / .4); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 31; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.drawer-head { display: flex; gap: 12px; align-items: flex-start; padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px 20px; border-bottom: 1px solid var(--line); }
.drawer-head > div { flex: 1 1 auto; min-width: 0; }
.drawer-head h2 { font-size: 19px; line-height: 1.3; margin: 2px 0 0; overflow-wrap: anywhere; }
.drawer-head h2:focus { outline: none; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px; display: grid; gap: 20px; align-content: start; }
.drawer-body section { min-width: 0; display: grid; gap: 8px; }
.drawer-body h3 { font: 600 11px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.d-ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.request { margin: 0; font-style: italic; color: var(--muted); }

  const v = lane || null;
  if ((it.queue || null) === v) return;
  const max = Math.max(0, ...items.filter(i => v && i.queue === v).map(i => i.queueOrder || 0));
  try { await db.collection("items").doc(it.id).update({ queue: v, queueOrder: v ? max + 10 : null, updatedAt: now(), updatedBy: myId }); }
  catch (e) { showError(e); }
}

async function moveInQueue(list, idx, dir) {
  const a = list[idx], b = list[idx + dir];
  if (!a || !b) return;
  let oa = b.queueOrder ?? (idx + dir + 1) * 10, ob = a.queueOrder ?? (idx + 1) * 10;
  if (oa === ob) oa = ob + dir * 5;
  try {
    await Promise.all([
      db.collection("items").doc(a.id).update({ queueOrder: oa }),
      db.collection("items").doc(b.id).update({ queueOrder: ob }),
    ]);
  } catch (e) { showError(e); }
}

  }
  const list = [...groups.entries()].map(([k, qs]) => ({ k, qs, it: k ? items.find(i => i.id === k) : null, blocking: qs.some(q => q.blocking) }))
    .sort((a, b) => (b.blocking ? 1 : 0) - (a.blocking ? 1 : 0) || String(a.qs[0].createdAt || "").localeCompare(String(b.qs[0].createdAt || "")));
  for (const g of list) {
    const head = el("div", { class: "panel-head" },
      el("h3", {}, g.it ? itemLink(g.it) : (g.k ? "Removed item" : "Whole launch")),
      el("span", { class: "tally", text: (g.it ? areaOf(g.it).title + " · " : "") + `${g.qs.length} open` }));
    box.append(el("section", { class: "panel q-group" }, head, ...g.qs.map(q => renderQuestionCard(q, "in"))));
  }
  const answered = questions.filter(q => q.status === "answered").sort((a, b) => String(b.answeredAt || "").localeCompare(String(a.answeredAt || ""))).slice(0, 10);
  if (answered.length) {
    box.append(el("details", { class: "answered panel" }, el("summary", { text: `Recently answered (${answered.length})` }),
      el("div", {}, answered.map(q => {
        const it = q.itemId ? items.find(i => i.id === q.itemId) : null;
        return el("div", { class: "qa" }, el("strong", { text: q.text }),
          q.resolution ? el("span", {}, el("span", { class: "res", text: resolutionText(q) })) : null,
          q.answer ? el("div", { class: "answer", text: q.answer }) : null,
          el("small", {}, it ? itemLink(it) : "Whole launch", q.answeredAt ? " · " + fmtDate(q.answeredAt) : ""), alsoLinks(q));
      }))));
  }
  return box;
}

function renderQuestionCard(q, ctx) {
  const card = el("div", { class: "ask", id: ctx === "in" ? "inq-" + q.id : null, "data-blocking": String(!!q.blocking) });
  card.append(el("div", { class: "ask-top" },
    q.blocking ? el("span", { class: "badge b-ask", text: "Stops work" }) : null,
    el("p", { class: "q", text: q.text })));
  if (q.why) card.append(el("p", { class: "why", text: "Decides: " + q.why }));
  const also = alsoLinks(q);
  if (also) card.append(also);
  if (canWrite) {
    const ta = el("textarea", { id: "ans-" + q.id + "-" + ctx, "aria-label": "Your answer to: " + q.text, placeholder: "Your answer" });
    ta.value = drafts[q.id] || "";
    ta.addEventListener("input", () => { drafts[q.id] = ta.value; });
    card.append(ta, el("div", { class: "row-btns" },
      el("button", { class: "btn primary", type: "button", text: "Save answer", onclick: () => answer(q, ta.value) })));
  }
  return card;
}

async function answer(q, text) {
  const a = text.trim();
  if (!a) return;
  delete drafts[q.id];
  try { await db.collection("questions").doc(q.id).update({ answer: a, status: "answered", answeredAt: now(), answeredBy: myId }); }
  catch (e) { showError(e); }
}

/* ---------- Checklist ---------- */
// Columns are data so later steps can add more (tags, kind, depends on) without touching the row code.
const COLUMNS = [
  { key: "status", label: "Status", cls: "c-status", cell: it => statusSelect(it, "cst-", true) },
  { key: "title", label: "Item", cls: "c-title", cell: it => { const n = blockedByDeps(it) ? unmetDeps(it).length : 0; return n ? [el("span", { class: "deps-n sm-only", title: `Waiting on ${n}`, text: `⛓${n} ` }), itemLink(it, "row-title")] : itemLink(it, "row-title"); } },
  { key: "kind", label: "Kind", cls: "c-kind hide-sm", cell: it => kindChip(it) || el("span", { class: "dash", text: "–" }) },
  { key: "tags", label: "Tags", cls: "c-tags hide-sm", cell: it => { const c = tagChips(it); return c.length ? el("span", { class: "tag-cell", title: tagsOf(it).map(tagLabel).join(", ") }, c) : null; } },
  { key: "area", label: () => groupBy === "area" ? "Section" : "Area", cls: "c-area hide-sm",
    cell: it => groupBy === "area" ? el("span", { class: "sec-cell", text: sectionTitle(it.section) })
      : el("span", { class: "area-cell" }, areaOf(it).title, el("small", { text: sectionTitle(it.section) })) },
  { key: "phase", label: "Phase", cls: "c-phase", cell: it => phaseBadge(it.phase) || el("span", { class: "dash", text: "–" }) },
  { key: "steps", label: "Steps", cls: "c-steps hide-sm", cell: it => { const t = stepTally(it.id); return t.total ? `${t.done}/${t.total}` : el("span", { class: "dash", text: "–" }); } },
  { key: "deps", label: "Deps", cls: "c-deps hide-sm", cell: it => { const n = blockedByDeps(it) ? unmetDeps(it).length : 0; return n ? el("span", { class: "deps-n", title: `Waiting on ${n} unfinished ${n === 1 ? "dependency" : "dependencies"}`, text: `⛓ ${n}` }) : null; } },
  { key: "blocked", label: "Blocked", cls: "c-blk hide-sm", cell: it => { const n = openBlocking(it.id).length; return n ? el("span", { class: "badge b-blocked", text: plural(n, "question") }) : it.status === "blocked" ? el("span", { class: "badge b-blocked", text: "Blocked" }) : null; } },
  { key: "updated", label: "Updated", cls: "c-upd hide-sm", cell: it => fmtDate(it.updatedAt) },
];

function renderChecklistTools() {
  const c = statusCounts();
  const n = { all: items.length, open: c.todo + c.doing, ready: items.filter(isReady).length, blocked: items.filter(i => isBlocked(i) || blockedByDeps(i)).length, done: c.done };
  $("chips").replaceChildren(...FILTERS.map(f => el("button", {
    class: "chip", type: "button", id: "f-" + f.v, "aria-pressed": String(filter === f.v),
    onclick: () => { filter = f.v; lsSet("adwear-launch-filter", filter); render(); },
  }, f.label, el("b", { text: String(n[f.v]) }))));
  $("groupby").replaceChildren(...GROUPS.map(g => el("button", {
    class: "seg-btn", type: "button", id: "g-" + g.v, "aria-pressed": String(groupBy === g.v),
    onclick: () => { groupBy = g.v; lsSet("adwear-groupby", groupBy); render(); },
  }, g.label)));
  renderFacets();
}

function viewActive(V) {
  const st = V.state;
  return filter === st.filter && kindF === st.kind && needsYou === st.needs && tagF.size === st.tags.length && st.tags.every(t => tagF.has(t));
}
function renderFacets() {
  const views = el("div", { class: "facet", role: "group", "aria-label": "Saved views" }, el("span", { class: "seg-label", text: "Views" }),
    SAVED_VIEWS.map(V => {
      const on = viewActive(V);
      return el("button", { class: "chip sm view", type: "button", id: "sv-" + V.v, "aria-pressed": String(on), onclick: () => {
        const st = on ? { filter: "all", kind: "", tags: [], needs: false } : V.state;
        filter = st.filter; kindF = st.kind; needsYou = st.needs; tagF.clear(); st.tags.forEach(t => tagF.add(t));
        lsSet("adwear-launch-filter", filter); saveFacets(); render();
      } }, V.label);
    }));
  const ks = el("select", { class: "q-select", id: "kind-f", "aria-label": "Filter by kind" },
    el("option", { value: "", text: "Any kind", selected: !kindF }),
    kinds().map(k => el("option", { value: k.v, text: k.label, selected: kindF === k.v })));
  ks.addEventListener("change", () => { kindF = ks.value; saveFacets(); render(); });
  const tags = el("div", { class: "facet", role: "group", "aria-label": "Filter by tags (all selected must match)" }, el("span", { class: "seg-label", text: "Tags" }),
    tagDefs().map(t => el("button", { class: "chip sm", type: "button", id: "tf-" + t.v.replace(/[^a-z0-9-]/gi, "-"), "aria-pressed": String(tagF.has(t.v)), title: t.hint || null,
      onclick: () => { tagF.has(t.v) ? tagF.delete(t.v) : tagF.add(t.v); saveFacets(); render(); } }, t.label,
      el("b", { text: String(items.filter(i => tagsOf(i).includes(t.v)).length) }))));
  const any = kindF || tagF.size || needsYou;
  $("facets").replaceChildren(...[views, el("div", { class: "facet" }, el("span", { class: "seg-label", text: "Kind" }), ks), tags,
    any ? el("button", { class: "link-btn", type: "button", id: "facets-clear", text: "Clear kind/tags", onclick: () => { kindF = ""; tagF.clear(); needsYou = false; saveFacets(); render(); } }) : null].filter(Boolean));
}

function checklistGroups() {
  if (groupBy === "status") {
    return STATUS_GROUP_ORDER.map(s => ({ key: "s:" + s, title: LABEL[s], all: items.filter(i => i.status === s).sort(byArea) }))
      .concat([{ key: "s:other", title: "Other", all: items.filter(i => !STATUS_GROUP_ORDER.includes(i.status)).sort(byArea) }])
      .filter(g => g.all.length);
  }
  if (groupBy === "kind") {
    return kinds().map(k => ({ key: "k:" + k.v, title: k.label, blurb: k.hint, all: items.filter(i => i.kind === k.v).sort(byArea) }))
      .concat([{ key: "k:none", title: "No kind", all: items.filter(i => !kinds().some(k => k.v === i.kind)).sort(byArea) }])
      .filter(g => g.all.length);
  }
  if (groupBy === "none") return [{ key: "all", title: null, all: [...items].sort(byArea) }];
  return [...AREAS, OTHER_AREA].map(a => ({
    key: "a:" + a.key, title: a.title, blurb: a.blurb, area: a,
    all: items.filter(i => areaOf(i) === a).sort((x, y) => sectionRank(x) - sectionRank(y) || byOrder(x, y)),
  })).filter(g => g.all.length || (canWrite && g.area !== OTHER_AREA));
}

function renderChecklist() {
  renderChecklistTools();
  const box = el("div", { style: "display:grid;gap:22px;min-width:0" });
  const narrowed = !!query || filter !== "all" || !!kindF || tagF.size > 0 || needsYou;
  let shown = 0;
  for (const g of checklistGroups()) {
    const rows = g.all.filter(matches);
    shown += rows.length;
    if (narrowed && !rows.length && adding !== (g.area && g.area.key)) continue;
    box.append(renderGroup(g, rows));
  }
  if (!shown && narrowed) box.prepend(notice("No items match.", "Try another filter, view or tag, or clear the search."));
  return box;
}

function renderGroup(g, rows) {
  const sec = el("section", { class: "cl-group", "aria-label": g.title || "All items" });
  const isCol = !!g.title && collapsed.has(g.key);
  if (g.title) {
    const counted = g.all.filter(i => i.status !== "skip");
    const done = counted.filter(i => i.status === "done").length;
    const blocked = counted.filter(isBlocked).length;
    const bodyId = "grp-" + g.key.replace(/[^a-z0-9-]/gi, "-");
    sec.append(el("button", {
      class: "grp-head", type: "button", id: "gh-" + g.key.replace(/[^a-z0-9-]/gi, "-"), "aria-expanded": String(!isCol), "aria-controls": bodyId,
      onclick: () => { isCol ? collapsed.delete(g.key) : collapsed.add(g.key); lsSet("adwear-collapsed", JSON.stringify([...collapsed])); render(); },
    }, el("span", { class: "chev", "aria-hidden": "true", text: "▾" }), el("h3", { text: g.title }),
      blocked ? el("span", { class: "flag", text: `${blocked} blocked` }) : null,
      el("span", { class: "tally", text: `${done}/${counted.length} done` })));
    if (isCol) return sec;
    const body = el("div", { id: bodyId, style: "display:grid;gap:8px;min-width:0" });
    if (g.blurb) body.append(el("p", { class: "grp-blurb", text: g.blurb }));
    sec.append(body);
    fillGroupBody(body, g, rows);
  } else {
    fillGroupBody(sec, g, rows);
  }
  return sec;
}

function fillGroupBody(body, g, rows) {
  if (rows.length) body.append(renderTable(rows));
  else body.append(el("p", { class: "empty-filter", text: g.all.length ? "Nothing here matches the current filter." : "No items yet." }));
  if (canWrite && g.area && g.area !== OTHER_AREA) body.append(renderAdd(g.area));
}

function renderTable(rows) {
  const head = el("tr", {}, COLUMNS.map(c => el("th", { class: c.cls, scope: "col", text: typeof c.label === "function" ? c.label() : c.label })));
  const tbody = el("tbody", {}, rows.map(it => el("tr", { "data-status": it.status, "data-id": it.id },
    COLUMNS.map(c => { const v = c.cell(it); return el("td", { class: c.cls }, v ?? ""); }))));
  return el("div", { class: "table-wrap" }, el("table", { class: "cl" }, el("thead", {}, head), tbody));
}

function renderAdd(area) {
  const key = area.key;
  const section = area.sections[0];
  const wrap = el("div", { class: "add" });
  if (adding !== key) {
    wrap.append(el("button", { class: "btn small", type: "button", id: "add-btn-" + key, "aria-label": "Add an item to " + area.title, text: "+ Add item",
      onclick: () => { adding = key; focusAfter = "add-title-" + key; render(); } }));
    return wrap;
  }
  const t = el("input", { id: "add-title-" + key, placeholder: "What needs to be true (e.g. Test order with Packeta)", "aria-label": "New item title", required: true });
  const d = el("input", { id: "add-detail-" + key, placeholder: "Details (optional)", "aria-label": "New item details" });
  const form = el("form", {}, t, d,
    el("p", { class: "hint", text: "Goes into " + sectionTitle(section) + "." }),
    el("div", { class: "row-btns" },
      el("button", { class: "btn primary", type: "submit", text: "Add item" }),
      el("button", { class: "btn", type: "button", text: "Cancel", onclick: () => { adding = null; focusAfter = "add-btn-" + key; render(); } })));
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const title = t.value.trim();
    if (!title) return;
    const maxOrder = Math.max(0, ...items.filter(i => i.section === section).map(i => i.order || 0));
    try {
      await db.collection("items").add({ section, title, detail: d.value.trim(), status: "todo", note: "", order: maxOrder + 10, updatedAt: now(), updatedBy: myId });
      adding = null; focusAfter = "add-btn-" + key; t.value = ""; d.value = ""; t.blur(); render();
    } catch (e) { showError(e); }
  });
  wrap.append(form);
  return wrap;
}

/* ---------- Ship ---------- */
function renderShip() {
  const list = unpushedSteps();
  if (!list.length) return notice("Nothing waiting to be pushed.", "");
  const repos = {};
  for (const s of list) (repos[String(s.commit).split(":")[0].trim() || "other"] ||= []).push(s);
  const grid = el("div", { class: "lanes" });
  for (const [repo, ss] of Object.entries(repos).sort()) {
    grid.append(el("section", { class: "panel lane", "aria-label": repo },
      el("div", { class: "lane-head" }, el("p", { class: "repo", text: repo }), el("span", { class: "tally", text: String(ss.length) })),
      el("ol", { class: "cards" }, ss.map(s => {
        const it = items.find(i => i.id === s.itemId);
        return el("li", { class: "card ship-card" },
          it ? itemLink(it, "card-title", s.title) : el("span", { class: "card-title", text: s.title }),
          it ? el("span", { class: "card-area", text: it.title }) : null,
          el("span", { class: "commit", text: s.commit }));
      }))));
  }
  return grid;
}

/* ---------- Done ---------- */
function renderDone() {
  const list = items.filter(i => i.status === "done" || i.status === "skip").sort(byUpdatedDesc);
  if (!list.length) return notice("Nothing finished yet.", "");
  return el("ul", { class: "done-list" }, list.map(it => el("li", { "data-status": it.status },
    el("span", { class: "mark", "aria-hidden": "true", text: it.status === "done" ? "✓" : "–" }),
    itemLink(it),
    el("small", { text: `${areaOf(it).title} · ${it.status === "done" ? "Done" : "Not needed"}` + (it.updatedAt ? " · " + fmtDate(it.updatedAt) : "") }))));
}

/* ---------- Drawer ---------- */
function renderDrawer() {
  const d = $("drawer");
  const open = !!drawerId;
  d.hidden = !open;
  $("drawer-backdrop").hidden = !open;
  $("shell").inert = open;
  document.body.classList.toggle("drawer-open", open);
  if (!open) { d.replaceChildren(); drawerShown = null; return; }
  const prev = $("drawer-body");
  const keepScroll = prev && drawerShown === drawerId ? prev.scrollTop : 0;
  const it = items.find(i => i.id === drawerId);
  const head = el("div", { class: "drawer-head" },
    el("div", {},
      el("div", { class: "eyebrow", text: it ? (areaOf(it).title === sectionTitle(it.section) ? areaOf(it).title : `${areaOf(it).title} · ${sectionTitle(it.section)}`) : "Item" }),
      el("h2", { id: "drawer-title", tabindex: "-1", text: it ? it.title : (loaded ? "Item not found" : "Loading…") })),
    el("button", { class: "icon-btn", type: "button", id: "drawer-close", "aria-label": "Close details", title: "Close (Esc)", text: "✕", onclick: closeDrawer }));
  const body = el("div", { class: "drawer-body", id: "drawer-body" });
  if (!it) {
    body.append(el("p", { class: "hint", text: loaded ? "This item doesn't exist any more. It may have been removed." : "Loading the item…" }));
  } else {
    body.append(renderItemDetail(it), renderKindTags(it), renderDeps(it));
    if (hasTask(it)) body.append(...renderTask(it));
    else body.append(el("p", { class: "hint", text: "No task yet. Ask Claude in the conversation to analyze this item." }));
  }
  d.replaceChildren(head, body);
  body.scrollTop = keepScroll;
  drawerShown = drawerId;
}

function renderItemDetail(it) {
  const sec = el("section", {});
  sec.append(el("div", { class: "d-ctrl" }, statusSelect(it, "st-", false), phaseBadge(it.phase), blockedBadge(it), waitBadge(it),
    isReady(it) ? el("span", { class: "badge b-ready", text: "Ready" }) : null,
    (canWrite || it.queue) ? queueSelect(it, "d") : null));
  if (it.detail) sec.append(el("p", { class: "detail", text: it.detail }));
  if (editingNote) {
    const ta = el("textarea", { id: "note-" + it.id, "aria-label": "Note for " + it.title });
    ta.value = it.note || "";
    sec.append(el("div", { class: "editor" }, ta, el("div", { class: "row-btns" },
      el("button", { class: "btn primary", type: "button", text: "Save note", onclick: () => saveNote(it, ta.value) }),
      el("button", { class: "btn", type: "button", text: "Cancel", onclick: () => { editingNote = false; focusAfter = "note-btn"; render(); } }))));
  } else if (it.note) {
    sec.append(el("p", { class: "note", text: it.note }));
  }
  const meta = el("div", { class: "meta" });
  if (it.updatedAt) {
    const who = personName(it.updatedBy);
    meta.append(el("span", { text: `${LABEL[it.status] || it.status} · ${fmtDate(it.updatedAt)}` + (who ? ` · ${who}` : "") }));
  }
  if (canWrite && !editingNote) {
    meta.append(el("button", { class: "link-btn", type: "button", id: "note-btn", text: it.note ? "Edit note" : "Add note", onclick: () => { editingNote = true; focusAfter = "note-" + it.id; render(); } }));
    if (pendingDelete === it.id) {
      meta.append(el("span", { text: "Remove this item?" }),
        el("button", { class: "link-btn danger", type: "button", id: "del-yes", text: "Remove", onclick: () => removeItem(it) }),
        el("button", { class: "link-btn", type: "button", id: "del-no", text: "Keep", onclick: () => { pendingDelete = null; focusAfter = "del-btn"; render(); } }));
    } else {
      meta.append(el("button", { class: "link-btn", type: "button", id: "del-btn", text: "Remove", onclick: () => { pendingDelete = it.id; focusAfter = "del-no"; render(); } }));
    }
  }
  if (meta.childNodes.length) sec.append(meta);
  return sec;
}

function renderKindTags(it) {
  const sec = el("section", {}, el("h3", { text: "Kind & tags" }));
  if (!canWrite) {
    const chips = [kindChip(it), ...tagChips(it)].filter(Boolean);
    sec.append(chips.length ? el("div", { class: "tag-toggles" }, chips) : el("p", { class: "hint", text: "None set." }));
    return sec;
  }
  const ks = el("select", { class: "q-select", id: "kind-" + it.id, "aria-label": "Kind of " + it.title },
    el("option", { value: "", text: "No kind", selected: !it.kind }),
    kinds().map(k => el("option", { value: k.v, text: k.label + (k.hint ? " — " + k.hint : ""), selected: it.kind === k.v })));
  if (it.kind && !kinds().some(k => k.v === it.kind)) ks.append(el("option", { value: it.kind, text: it.kind, selected: true }));
  ks.addEventListener("change", () => setKind(it, ks.value));
  const known = tagDefs().map(t => t.v);
  const extra = tagsOf(it).filter(t => !known.includes(t)).map(t => ({ v: t, label: tagLabel(t) }));
  sec.append(el("div", { class: "d-ctrl" }, ks),
    el("div", { class: "tag-toggles", role: "group", "aria-label": "Tags" }, [...tagDefs(), ...extra].map(t =>
      el("button", { class: "chip sm", type: "button", id: "tt-" + it.id + "-" + t.v.replace(/[^a-z0-9-]/gi, "-"), "aria-pressed": String(tagsOf(it).includes(t.v)), title: t.hint || null,
        onclick: () => toggleTag(it, t.v) }, t.label))));
  return sec;
}

function depRow(id, removable, it) {
  const d = byId(id);
  const met = isClosed(d);
  const li = el("li", { "data-met": String(met) },
    el("span", { class: "mark", "aria-hidden": "true", text: met ? "✓" : "○" }),
    d ? itemLink(d) : el("span", { text: "Removed item (" + id + ")" }),
    el("small", { text: d ? (LABEL[d.status] || d.status) : "missing" }));
  if (removable) li.append(el("button", { class: "icon-btn", type: "button", id: "dep-rm-" + id, "aria-label": "Remove dependency on " + (d ? d.title : id), title: "Remove", text: "✕", onclick: () => removeDep(it, id) }));
  return li;
}

function renderDeps(it) {
  const sec = el("section", {});
  const deps = depsOf(it);
  const unmet = unmetDeps(it).length;
  sec.append(el("h3", { text: `Depends on · ${deps.length ? `${deps.length - unmet}/${deps.length} done` : "nothing"}` }));
  const cyc = findCycle(it.id);
  if (cyc) sec.append(el("p", { class: "warn", role: "alert", text: "Dependency loop: " + cyc.map(id => (byId(id) || { title: id }).title).join(" → ") + ". Remove one link to break it." }));
  if (deps.length) sec.append(el("ul", { class: "dep-list" }, deps.map(id => depRow(id, canWrite, it))));
  if (canWrite) {
    const listId = "dep-opts-" + it.id;

// #/home … #/done pick the tab; #/item/<id> opens the drawer over the current tab.
// Old links: #<itemId> opens the drawer, #queue goes home, #sec-<key> goes to the checklist.
function parseHash() {
  let h = "";
  try { h = decodeURIComponent((location.hash || "").slice(1)); } catch (e) { h = (location.hash || "").slice(1); }
  if (!h) return { tab: null, item: null };
  if (h.startsWith("/item/")) return { tab: null, item: h.slice(6) || null };
  if (h.startsWith("/")) { const t = h.slice(1); return { tab: TAB_KEYS.includes(t) ? t : "home", item: null }; }
  if (h === "queue") return { tab: "home", item: null };
  if (h.startsWith("sec-")) return { tab: "checklist", item: null };
  return { tab: null, item: h, legacy: true };
}

function applyHash() {

  if (r.legacy) { try { history.replaceState(null, "", "#/item/" + encodeURIComponent(r.item)); } catch (e) {} }
  if (r.tab && r.tab !== tab) { tab = r.tab; lsSet("adwear-tab", tab); window.scrollTo(0, 0); }
  const was = drawerId;
  drawerId = r.item || null;
  if (drawerId && drawerId !== was) {
    if (!was) lastFocusEl = document.activeElement;

    editingNote = false;

  if (!drawerId) return;

    // Keep a half-typed answer or note: Esc only closes when no text field with content has focus.
    if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && (a.value || "").trim()) return;
    e.preventDefault();
    closeDrawer();

  }
  if (e.key !== "Tab") return;
  const f = [...d.querySelectorAll('a[href], button:not([disabled]), select:not([disabled]), textarea, input, summary, [tabindex]:not([tabindex="-1"])')]
    .filter(n => n.getClientRects().length);

  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }

/* ---------- Flow diagrams ---------- */
function renderFlow(key, src, label, openByDefault) {
  const det = el("details", { class: "flow" });
  const initial = flowOpen.has(key) ? flowOpen.get(key) : openByDefault;
  det.open = initial;
  // Setting `open` above also fires "toggle"; only a viewer's click changes the state.
  det.addEventListener("toggle", () => { if (det.open === initial) return; flowOpen.set(key, det.open); render(); });
  det.append(el("summary", { text: label }));
  if (det.open) {
    const body = el("div", { class: "flow-body" });
    fillFlow(body, src);
    det.append(body);
  }
  return det;
}

function fillFlow(box, src) {
  const cached = flowCache[src];
  if (cached && cached.svg) { box.innerHTML = cached.svg; return; }
  const m = window.mermaid;
  if ((cached && cached.error) || !m || typeof m.render !== "function") {
    if (cached && cached.error) box.append(el("p", { class: "hint", text: "This diagram couldn't be drawn. Its source is below." }), el("pre", { class: "flow-src", text: src }));
    else box.append(el("pre", { class: "mermaid", text: src }));
    // The viewer's diagram renderer can arrive after the first paint; look once more.
    if (!m && !fillFlow.waited) { fillFlow.waited = true; setTimeout(render, 1500); }
    return;
  }
  box.append(el("p", { class: "hint", text: "Drawing the diagram…" }));
  const id = "flow-svg-" + (++flowSeq);
  Promise.resolve(m.render(id, src))
    .then(r => { flowCache[src] = { svg: r.svg }; })
    .catch(() => { flowCache[src] = { error: true }; const stray = document.getElementById("d" + id); if (stray) stray.remove(); })
    .then(() => render());
}

  }, lost);
  db.collection("analyses").onSnapshot(snap => {
    analyses = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    render();
  }, () => {});
  db.collection("questions").onSnapshot(snap => {
    questions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => {});
  db.collection("steps").onSnapshot(snap => {
    steps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => {});
  db.doc("meta/goal").onSnapshot(snap => {
    goal = snap.exists ? snap.data() : null;
    render();
  }, () => {});
  db.doc("meta/schema").onSnapshot(snap => {
    schema = snap.exists ? snap.data() : null;
    render();
  }, () => {});
})();
</script>
