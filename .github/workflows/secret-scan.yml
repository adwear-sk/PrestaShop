# Gitleaks over the commits pushed to `production`.
# This repo is public: once pushed, a secret is already out, so this does not gate
# the deploy. A red run (and GitHub's failed-run e-mail) is the alert to rotate it.
# Find the leak by re-running gitleaks locally; never add -v here, it would print
# the matched lines into the public log.
#
# Scope: --first-parent --no-merges keeps upstream release merges (thousands of
# commits with test fixtures) out. That relies on linear integration: main lands
# wt/* branches by rebase or cherry-pick, never `git merge --no-ff`, or the merged
# commits are skipped.
#
# Own workflow, not a job in deploy-prod.yml: its concurrency group would drop
# queued runs, and with them the scan of their commits.
# gitleaks-action is not used: it needs a paid licence for organisation repos.
# Keep this file in bin/disable-upstream-workflows.sh's KEEP list.
name: Secret scan

on:
  push:
    branches: [ production ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
          persist-credentials: false

      - name: Gitleaks (pushed range)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="-n 150 HEAD"
            echo "::warning::pushed range unknown (manual run, new branch or force-push); scanning the last 150 first-parent commits only"
          fi
          echo "scanning: --first-parent --no-merges $range"
          # The image's user differs from the checkout's owner: allow the repo for git.
          docker run --rm -v "$PWD":/src -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git --no-banner --redact --exit-code 1 --log-opts="--first-parent --no-merges $range" /src
