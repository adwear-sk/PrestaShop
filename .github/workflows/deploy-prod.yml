# Build the PrestaShop image and deploy it to www.adwear.sk.
# Trigger: push to the `production` branch (merge develop -> production to ship),
# or run manually from the Actions tab.
#
# Required repo secrets:
#   SSH_HOST   - VPS IP / hostname
#   SSH_USER   - deploy
#   SSH_KEY    - private SSH key whose public half is in the deploy user's authorized_keys
name: Deploy to production

on:
  push:
    branches: [ production ]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/prestashop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the job token out of .git/config, which ends up in the image.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Record which prestashop/base digest this image is built on; the weekly
      # base-image-check.yml compares it with the newest one to spot pending patches.
      - name: Resolve base image digest
        id: base
        run: |
          version=$(sed -n 's/^ARG VERSION="\(.*\)"/\1/p' deploy/Dockerfile)
          digest=$(docker buildx imagetools inspect "prestashop/base:$version" --format '{{json .Manifest.Digest}}' | tr -d '"' || true)
          # Non-fatal: a deploy must not fail on a Docker Hub hiccup; the weekly check then alerts once.
          [ -n "$digest" ] || echo "::warning::could not resolve prestashop/base:$version; image gets no base-digest label"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # Always build on the newest base image, so a deploy also ships its PHP/OS patches.
          pull: true
          push: true
          labels: |
            org.adwear.base-digest=${{ steps.base.outputs.digest }}
          build-args: |
            ADMIN_FOLDER=${{ secrets.ADMIN_FOLDER }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      - name: Copy crontab, host scripts, backup config and SQL migrations to the VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/crontab,deploy/prune-logs.sh,deploy/prune-visitors.sh,deploy/prune-history.sh,deploy/mysql-weekly.sh,deploy/healthcheck.sh,deploy/backup.sh,deploy/borgmatic,deploy/migrate.sh,deploy/release.sh,deploy/sql"
          target: /opt/adwear/
          strip_components: 1

      - name: Pull new image & restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # release.sh pins this exact image (not :latest) in .env, keeps the previous
          # one for `release.sh rollback`, and runs the post-steps every new app
          # container needs (translations, migrations, mails, cache, .htaccess, robots, cron).
          script: |
            set -e
            chmod +x /opt/adwear/release.sh
            /opt/adwear/release.sh ${{ env.IMAGE }}:${{ github.sha }}
